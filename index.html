<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>品川区 地域センター・区民集会所 マップ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H"
  crossorigin="anonymous" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif; }
  header { padding: 10px 16px; background: #f5f5f5; border-bottom: 1px solid #ddd; }
  header h1 { margin: 0; font-size: 1.05rem; }
  header p { margin: 4px 0 0; font-size: 0.8rem; color: #555; }
  #map { position: absolute; top: 64px; left: 0; right: 0; bottom: 0; }
  .legend { background: white; padding: 8px 10px; border-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,.3); font-size: 0.78rem; line-height: 1.6; }
  .legend span { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  .popup-title { font-weight: bold; margin-bottom: 4px; }
</style>
</head>
<body>
<header>
  <h1>品川区 地域センター・区民集会所 マップ</h1>
  <p>区内16施設（地域センター13・区役所・防災センター・東大井区民集会所）の位置情報</p>
</header>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH"
  crossorigin="anonymous"></script>
<script>
const map = L.map('map').setView([35.605, 139.72], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 18,
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

const COLOR = {
  '地域センター・区民集会所（併設）': '#2171b5',
  '地域センター（集会所なし）': '#f59f00',
  '区民集会所（単独）': '#2ca02c',
  'その他施設': '#888888'
};

fetch('shinagawa_facilities.geojson')
  .then(r => r.json())
  .then(data => {
    const layer = L.geoJSON(data, {
      pointToLayer: function (feature, latlng) {
        return L.circleMarker(latlng, {
          radius: 7,
          fillColor: COLOR[feature.properties.category] || '#333',
          color: '#333',
          weight: 1,
          fillOpacity: 0.85
        });
      },
      onEachFeature: function (feature, layer) {
        const p = feature.properties;
        const [lng, lat] = feature.geometry.coordinates;
        const html = `
          <div class="popup-title">${esc(p.name)}</div>
          <div>${esc(p.address)}</div>
          <div>種別：${esc(p.category)}</div>
          <div style="margin-top:4px;">${esc(p.note || '')}</div>
          <div style="margin-top:6px;">
            <a href="https://www.google.com/maps?layer=c&cbll=${encodeURIComponent(lat)},${encodeURIComponent(lng)}" target="_blank" rel="noopener noreferrer">📷 ストリートビューで見る</a>
          </div>
        `;
        layer.bindPopup(html, { maxWidth: 280 });
      }
    }).addTo(map);
    map.fitBounds(layer.getBounds(), { padding: [30, 30] });
  });

const legend = L.control({ position: 'bottomright' });
legend.onAdd = function () {
  const div = L.DomUtil.create('div', 'legend');
  div.innerHTML = `
    <b>施設の種別</b><br>
    <span style="background:#2171b5"></span>地域センター・区民集会所（併設）<br>
    <span style="background:#f59f00"></span>地域センター（集会所なし）<br>
    <span style="background:#2ca02c"></span>区民集会所（単独）<br>
    <span style="background:#888888"></span>その他施設
  `;
  return div;
};
legend.addTo(map);
</script>
</body>
</html>
