<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>東京都区部 地域センター・区民集会所 マップ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H"
  crossorigin="anonymous" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif; }
  body { display: flex; flex-direction: column; }
  header { flex: 0 0 auto; padding: 10px 16px; background: #f5f5f5; border-bottom: 1px solid #ddd; }
  header select { font-size: 16px; padding: 4px 6px; }
  #chips { margin-top: 6px; overflow-x: auto; white-space: nowrap; -webkit-overflow-scrolling: touch; padding-bottom: 4px; }
  #chips button { font-size: 14px; padding: 6px 10px; margin-right: 6px; border: 1px solid #bbb; border-radius: 16px; background: #fff; color: #222; }
  #chips button.on { background: #1a73e8; border-color: #1a73e8; color: #fff; font-weight: bold; }
  header .src { display: block; margin-top: 4px; font-size: 0.72rem; color: #666; }
  header h1 { margin: 0; font-size: 1.05rem; }
  header p { margin: 4px 0 0; font-size: 0.8rem; color: #555; }
  #map { flex: 1 1 auto; min-height: 0; position: relative; }
  .legend { background: white; padding: 8px 10px; border-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,.3); font-size: 0.78rem; line-height: 1.6; }
  .legend span { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  @media (max-width: 600px) { .legend { font-size: 0.66rem; line-height: 1.35; padding: 5px 7px; max-width: 62vw; } .legend span { width: 9px; height: 9px; margin-right: 4px; } header h1 { font-size: 0.95rem; } }
  .popup-title { font-weight: bold; margin-bottom: 4px; }
  .sv-btn { display: inline-block; padding: 6px 12px; background: #1a73e8; color: #fff !important; border-radius: 4px; text-decoration: none; font-size: 0.85rem; font-weight: bold; }
  .sv-btn:hover { background: #1558b0; }
  .list-toggle { background: #fff; padding: 6px 10px; border-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,.3); font-size: 0.85rem; cursor: pointer; border: 0; }
  .list-panel { display: none; background: #fff; width: 280px; max-height: calc(100vh - 290px); overflow-y: auto; border-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,.3); font-size: 0.8rem; }
  .list-panel.open { display: block; }
  .list-item { padding: 8px 10px; border-bottom: 1px solid #eee; }
  .list-item .name { font-weight: bold; cursor: pointer; }
  .list-item .name:hover { text-decoration: underline; }
  .list-item .sv-btn { margin-top: 4px; padding: 3px 8px; font-size: 0.78rem; }
</style>
</head>
<body>
<header>
  <h1>東京都区部 地域センター・区民集会所 マップ</h1>
  <p><label>区を選ぶ：<select id="ward"><option value="">全区（東京都区部）</option></select></label>
  <span id="count"></span></p>
  <div id="chips"></div>
  <span id="src" class="src"></span>
</header>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH"
  crossorigin="anonymous"></script>
<script>
const map = L.map('map', { renderer: L.canvas({ tolerance: 8 }) }).setView([35.605, 139.72], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 18,
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

const WARDS = ['千代田区','中央区','港区','新宿区','文京区','台東区','墨田区','江東区','品川区','目黒区','大田区','世田谷区','渋谷区','中野区','杉並区','豊島区','北区','荒川区','板橋区','練馬区','足立区','葛飾区','江戸川区'];

function svUrl(lat, lng) {
  return 'https://www.google.com/maps?layer=c&cbll=' + encodeURIComponent(lat) + ',' + encodeURIComponent(lng);
}

const COLOR = {
  '地域センター・区民集会所（併設）': '#2171b5',
  '地域センター（集会所なし）': '#f59f00',
  '集会施設（OSM）': '#7b3fa0',
  '区民会館（区の公式情報）': '#d9480f',
  '地域活動センター（区の公式情報）': '#0b7285',
  '区民センター（区の公式情報）': '#d9480f',
  '地域交流センター（区の公式情報）': '#2171b5',
  '区民集会所（単独）': '#2ca02c',
  'その他施設': '#888888'
};

let allFeatures = [];
let layer = null;

// 地図の拡大率に合わせて、点の大きさを変える（全体表示では小さく、拡大すると大きく）
function dotRadius(z) {
  if (z <= 10) return 2;
  if (z === 11) return 2.8;
  if (z === 12) return 3.6;
  if (z === 13) return 4.6;
  if (z === 14) return 5.6;
  if (z === 15) return 6.6;
  return 7.6;
}
function dotWeight(z) { return z <= 12 ? 0.6 : 1; }
function restyleDots() {
  if (!layer) return;
  const z = map.getZoom();
  layer.eachLayer(l => { if (l.setStyle) l.setStyle({ radius: dotRadius(z), weight: dotWeight(z) }); });
}
map.on('zoomend', restyleDots);

function render(ward) {
  if (layer) map.removeLayer(layer);
  const panel = document.getElementById('list-panel');
  panel.innerHTML = '';
  const feats = allFeatures.filter(f => !ward || f.properties.ward === ward);
  document.getElementById('count').textContent =
    (ward || '東京都区部') + '：' + feats.length + '施設';
  layer = L.geoJSON({ type: 'FeatureCollection', features: feats }, {
    pointToLayer: function (feature, latlng) {
      return L.circleMarker(latlng, {
        radius: dotRadius(map.getZoom()),
        fillColor: COLOR[feature.properties.category] || (feature.properties.category.endsWith('（区の公式情報）') ? '#d9480f' : '#333'),
        color: '#333',
        weight: dotWeight(map.getZoom()),
        fillOpacity: 0.85
      });
    },
    onEachFeature: function (feature, l) {
      const p = feature.properties;
      const [lng, lat] = feature.geometry.coordinates;
      const html = `
        <div class="popup-title">${esc(p.name)}</div>
        <div>${esc(p.ward)} ${esc(p.address)}</div>
        <div>種別：${esc(p.category)}</div>
        <div style="margin-top:4px;">${esc(p.note || '')}</div>
        <div style="margin-top:4px;font-size:0.75rem;color:#666;">出典：${esc(p.source)}</div>
        <div style="margin-top:6px;">
          <a class="sv-btn" href="${svUrl(lat, lng)}" target="_blank" rel="noopener noreferrer">📷 ストリートビューで見る</a>
        </div>
      `;
      l.bindPopup(html, { maxWidth: 280 });

      const item = document.createElement('div');
      item.className = 'list-item';
      const name = document.createElement('div');
      name.className = 'name';
      name.textContent = p.name;
      name.addEventListener('click', function () {
        map.setView([lat, lng], 17);
        l.openPopup();
      });
      const a = document.createElement('a');
      a.className = 'sv-btn';
      a.href = svUrl(lat, lng);
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.textContent = '📷 ストリートビュー';
      item.appendChild(name);
      item.appendChild(a);
      panel.appendChild(item);
    }
  }).addTo(map);
  if (feats.length) map.fitBounds(layer.getBounds(), { padding: [30, 30], maxZoom: 16 });
  restyleDots();
}

fetch('tokyo_facilities.geojson?v=' + Date.now())
  .then(r => r.json())
  .then(data => {
    allFeatures = data.features;
    const official = new Set(allFeatures.filter(f => f.properties.category.endsWith('（区の公式情報）') || f.properties.source.indexOf('品川区の公式') === 0).map(f => f.properties.ward));
    document.getElementById('src').textContent = official.size === WARDS.length
      ? '各区の公式サイトの情報（2026-10-17確認）。区ごとに施設の呼び名が違い（区民館・地区会館・住区センター等）、公式サイトに載る範囲を掲載しています'
      : '区の公式情報：' + official.size + '区。その他の区はOpenStreetMapの登録データ（登録漏れあり）';
    document.getElementById('src').textContent += '　［版：2026-10-18 点を小さく調整済み］';
    const sel = document.getElementById('ward');
    const have = new Set(allFeatures.map(f => f.properties.ward));
    WARDS.forEach(w => {
      const o = document.createElement('option');
      o.value = w;
      o.textContent = w + (have.has(w) ? '' : '（データなし）');
      sel.appendChild(o);
    });
    const chips = document.getElementById('chips');
    const chipEls = [];
    function pick(w) {
      sel.value = w;
      chipEls.forEach(b => b.classList.toggle('on', b.dataset.w === w));
      render(w);
    }
    ['', ...WARDS].forEach(w => {
      const b = document.createElement('button');
      b.type = 'button';
      b.dataset.w = w;
      b.textContent = w || '全区';
      b.addEventListener('click', () => pick(w));
      chips.appendChild(b);
      chipEls.push(b);
    });
    sel.addEventListener('change', () => pick(sel.value));
    pick('');
  });

const legend = L.control({ position: 'bottomright' });
legend.onAdd = function () {
  const div = L.DomUtil.create('div', 'legend');
  div.innerHTML = `
    <b>施設の種別</b><br>
    <span style="background:#2171b5"></span>地域センター・区民集会所（併設）<br>
    <span style="background:#f59f00"></span>地域センター（集会所なし）<br>
    <span style="background:#2ca02c"></span>区民集会所（単独）<br>
    <span style="background:#d9480f"></span>区民会館・区民館・区民センター・住区センター・地区会館・集会所など（区の公式情報）<br>
    <span style="background:#2171b5"></span>地域交流センター（区の公式情報）<br>
    <span style="background:#0b7285"></span>地域活動センター（区の公式情報）<br>
    <span style="background:#888888"></span>その他施設
  `;
  return div;
};
legend.addTo(map);

const listCtl = L.control({ position: 'topright' });
listCtl.onAdd = function () {
  const div = L.DomUtil.create('div');
  div.innerHTML = '<button class="list-toggle" type="button">施設一覧・ストリートビュー</button><div id="list-panel" class="list-panel"></div>';
  L.DomEvent.disableClickPropagation(div);
  L.DomEvent.disableScrollPropagation(div);
  div.querySelector('button').addEventListener('click', function () {
    document.getElementById('list-panel').classList.toggle('open');
  });
  return div;
};
listCtl.addTo(map);
</script>
</body>
</html>
